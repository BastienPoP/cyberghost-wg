# Weekly pull requests for a new gluetun base image and new action versions.
# The pull request builds the image without publishing it; merging a gluetun
# update publishes it as latest (image workflow).
version: 2
updates:
  - package-ecosystem: docker
    directory: /gluetun
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
