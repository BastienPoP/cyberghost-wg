name: release

# Push a tag such as v0.1.0 (it must match VERSION in the script): the tests run,
# then a GitHub release is published with the script, its SHA256SUMS and the
# matching CHANGELOG section as notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: The tag matches the script version
        run: |
          version=$(python cyberghost-wg --version | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but the script says $version"; exit 1
          fi
      - name: Checksum and notes
        run: |
          sha256sum cyberghost-wg > SHA256SUMS
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for ${GITHUB_REF_NAME#v}"; exit 1; }
          printf '\n```\n%s\n```\n' "$(cat SHA256SUMS)" >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cyberghost-wg SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md
